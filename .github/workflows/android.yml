# 안드로이드 APK 빌드
#
# 맥에 Java 나 Android SDK 를 깔지 않아도 됩니다. 여기서 만들어 줍니다.
# Actions 탭에서 "Run workflow" 를 누르면 APK 가 나오고,
# 태그를 올리면 Releases 에 붙어서 링크로 바로 배포할 수 있습니다.
#
# ⚠️ 앱 껍데기만 만듭니다. 화면·기능 수정은 이걸 다시 돌릴 필요가 없습니다
#    (앱이 서버 화면을 띄우므로 Vercel 배포만으로 반영됩니다).

name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: 의존성 설치
        run: npm ci

      - name: 껍데기 동기화
        run: npx cap sync android

      - name: 서명 키 준비
        # 키가 등록돼 있으면 정식 서명, 없으면 디버그 서명으로 빌드합니다.
        # (디버그 서명 APK 도 설치는 되지만, 정식 키를 쓰는 편이 좋습니다)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "서명 키가 없어 디버그 빌드로 진행합니다."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: APK 빌드
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: APK 찾기
        id: apk
        run: |
          FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "찾은 파일: $FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: bigpicture-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Releases 에 올리기
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## 설치 방법

            아래 APK 파일을 휴대폰에서 내려받아 실행하면 설치됩니다.
            "출처를 알 수 없는 앱" 경고가 뜨면 허용해 주세요.

            앱은 서버 화면을 띄우므로, 앞으로 기능이 바뀌어도
            **다시 설치할 필요 없이 자동으로 반영됩니다.**
